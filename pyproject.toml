[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "endocleave"
version = "0.1.0"
description = "Stochastic simulation of protein hydrolysis by endoproteases, from cleavage-frequency data"
readme = "README.md"
license = "ISC"
license-files = ["LICENSE"]
authors = [
    { name = "Alberto Tonda", email = "alberto.tonda@gmail.com" },
]
requires-python = ">=3.9"
keywords = ["protein", "peptide", "endoprotease", "proteolysis", "hydrolysis", "bioinformatics", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "pandas>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/albertotonda/simplified-protein-cutting"
Repository = "https://github.com/albertotonda/simplified-protein-cutting"
Paper = "https://doi.org/10.1039/c7fo00830a"

[tool.scikit-build]
cmake.source-dir = "cpp"
cmake.build-type = "Release"
# only the Python extension module gets install()'d by cpp/CMakeLists.txt (see there); the
# CLI executable is deliberately not bundled into the wheel for now
wheel.packages = ["src/endocleave"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
# Python 3.9-3.12, 64-bit only: musllinux (Alpine) and 32-bit builds are skipped to keep
# the release matrix manageable; can be widened later without any other changes needed.
build = "cp39-* cp310-* cp311-* cp312-*"
skip = "*-musllinux* *_i686 *-win32"
build-verbosity = 1
# actually import and run the built wheel (not just "did it build") for every single wheel,
# on every platform, right after building it -- this is exactly the kind of check that would
# have caught the MinGW-DLL-dependency issue found earlier, automatically, for free
test-command = "python -c \"import endocleave; df = endocleave.simulate({'parameters': {'maxDH': 0.05, 'randomSeed': 1}, 'proteins': [{'quantity': 3, 'sequence': 'aaffaa'}], 'cuts': {'f': {'f': 1.0}}}); assert len(df) > 0; print('endocleave', endocleave.__version__, 'OK:', df.shape)\""
